[project]
name = "ai-stock-intelligence-backend"
version = "0.1.0"
description = "FastAPI backend for Analyq."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0,<26.0.0",
    "anyio>=4.10.0,<4.15.0",
    "alembic>=1.14",
    "fastapi>=0.115.0",
    "google-auth>=2.40.0,<3.0.0",
    "google-genai>=2.24.0,<3.0.0",
    "PyJWT>=2.10.0,<3.0.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6.0",
    "requests>=2.32.0,<3.0.0",
    "scikit-learn>=1.6.0,<2.0.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32.0",
    "vaderSentiment>=3.3.2,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
