# Independent from docker-compose.yml: never adopts the development database volume.
name: analyq

x-api: &api
  image: ${API_IMAGE:-analyq-api:local}
  build:
    context: ./backend
    target: runtime
  env_file: ${DEPLOY_ENV_FILE:-.env.deploy}
  environment:
    DATABASE_URL: postgresql+psycopg://analyq:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}@db:5432/analyq
    REQUIRE_AUTH: ${REQUIRE_AUTH:-true}
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  db:
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_USER: analyq
      POSTGRES_DB: analyq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.deploy}
    volumes:
      - deployment_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  migrate:
    <<: *api
    command: [alembic, upgrade, head]
    restart: 'no'
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ${WEB_IMAGE:-analyq-web:local}
    build: ./frontend
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  deployment_postgres:
